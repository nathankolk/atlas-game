  <!-- LEVEL SHEET (opened by a level card; contents drawn by the script) -->
  <div class="sheet-scrim" id="level-sheet-scrim" data-action="sheet-close" hidden></div>
  <div class="sheet" id="level-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <span class="sheet-grabber" aria-hidden="true"></span>
    <button type="button" class="icon-btn sheet-close" data-action="sheet-close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    <div class="sheet-scroll">
      <div class="sheet-info" id="sheet-info"></div>
      <div class="sheet-play" id="sheet-play"></div>
    </div>
    <div class="sheet-start">
      <button type="button" class="btn btn--primary btn--xl btn--block" id="sheet-start-btn" data-action="sheet-start"></button>
    </div>
  </div>
