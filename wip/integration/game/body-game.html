  <!-- GAME SCREEN: the map is the stage; everything else floats over it -->
  <div id="game-screen" class="screen">
    <div class="stage" id="map-wrap">
      <canvas id="sat-canvas" class="sat-canvas" aria-hidden="true"></canvas>
      <svg id="world-map" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map"></svg>
      <div class="sat-credit" id="sat-credit">Imagery © Esri, Maxar, Earthstar Geographics</div>
    </div>

    <header class="gamebar">
      <div class="gamebar-left">
        <button type="button" class="icon-btn" id="back-btn" aria-label="Leave this round"><svg class="icon icon--lg" aria-hidden="true"><use href="#i-back"/></svg></button>
        <button type="button" class="btn btn--ghost gamebar-return" id="review-back-btn"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>Results</button>
        <div class="gamebar-title">
          <strong id="region-tag">—</strong>
          <span class="tag" id="game-kind" hidden></span>
          <span class="tag" id="game-diff"></span>
          <span class="gamebar-sub" id="game-sub"></span>
        </div>
      </div>
      <div class="gamebar-progress"><span class="num" id="game-count">—</span><span id="game-of"></span></div>
      <dl class="gamebar-stats">
        <div class="is-extra" id="stat-extra" hidden><dt id="stat-extra-label"></dt><dd class="num" id="stat-extra-value">—</dd></div>
        <div><dt id="stat-score-label">Score</dt><dd class="num" id="stat-score">0</dd></div>
        <div><dt>Time</dt><dd class="num" id="stat-time">0:00</dd></div>
      </dl>
      <div class="gamebar-track" id="game-track" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><i></i></div>
    </header>

    <div class="hud-top">
      <div class="prompt float" id="prompt" aria-live="polite" aria-atomic="true">
        <span class="eyebrow"><span id="prompt-label">Find on the map</span><span class="prompt-try" id="prompt-try" hidden><i>·</i>Second try</span></span>
        <strong class="prompt-name" id="prompt-country">—</strong>
        <span class="prompt-note" id="prompt-note" hidden></span>
        <div class="choices" id="choices-panel" hidden></div>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>

    <div class="mapctl" role="group" aria-label="Map">
      <div class="mapctl-group float">
        <button type="button" id="zoom-in-btn" aria-label="Zoom in"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button type="button" id="zoom-out-btn" aria-label="Zoom out"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
        <button type="button" id="zoom-reset-btn" aria-label="Reset view"><svg class="icon" aria-hidden="true"><use href="#i-target"/></svg></button>
      </div>
      <button type="button" class="mapctl-solo float" id="map-style-btn" aria-label="Satellite map" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg></button>
    </div>

    <div class="game-legend float" id="game-legend">
      <span><i></i>Found <b id="legend-found">0</b></span>
      <span class="is-second"><i></i>Second try <b id="legend-second">0</b></span>
      <span class="is-missed"><i></i>Missed <b id="legend-missed">0</b></span>
    </div>

    <div class="map-hint map-hint--once float" id="zoom-hint" hidden><span class="for-mouse">Scroll to zoom · drag to pan</span><span class="for-touch">Pinch to zoom · drag to pan</span></div>
    <div class="map-hint float" id="learn-hint" hidden>Zoom in to see every name</div>

    <div class="game-actions">
      <button type="button" class="skip float" id="skip-btn">Skip <kbd aria-hidden="true">S</kbd></button>
      <button type="button" class="game-go" id="learn-ready-btn" hidden>Quiz me <kbd aria-hidden="true"><svg class="icon"><use href="#i-enter"/></svg></kbd></button>
      <button type="button" class="game-go" id="pin-btn" hidden disabled><span id="pin-btn-label">Drop pin</span> <kbd aria-hidden="true"><svg class="icon"><use href="#i-enter"/></svg></kbd></button>
    </div>
  </div>

  <!-- RESULTS SCREEN (the summary and the detail are drawn by the script) -->
  <div id="results-screen" class="screen">
    <div class="results-bar">
      <button type="button" class="btn btn--ghost" id="home-btn"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>Home</button>
      <p class="eyebrow"><span id="results-region">—</span><span class="results-date" id="results-date"></span></p>
      <button type="button" class="btn btn--ghost" id="share-btn"><svg class="icon" aria-hidden="true"><use href="#i-share"/></svg><span>Share</span></button>
    </div>
    <div class="results">
      <div class="results-hero">
        <div class="results-summary" id="results-summary"></div>
        <div class="results-actions">
          <button type="button" class="btn btn--primary" id="review-next-btn" hidden></button>
          <button type="button" class="btn btn--secondary" id="practice-btn" hidden></button>
          <button type="button" class="btn btn--secondary" id="replay-btn"></button>
          <button type="button" class="btn btn--secondary" id="daily-practice-btn" hidden>Practice replay</button>
        </div>
        <div class="results-more">
          <button type="button" class="btn btn--ghost" id="view-map-btn" hidden><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg>View on the map</button>
        </div>
      </div>
      <div class="results-detail" id="results-detail"></div>
    </div>
  </div>
