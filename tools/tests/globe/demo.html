<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globe engine demo</title>
<style>
  :root {
    --parchment: #f1e7d2; --parchment-deep: #e8dcc0; --ink: #1f2a3a; --ink-faded: #6b6250;
    --sepia: #6b4423; --gold: #c8953c; --land: #f5ebd4; --moss: #5f8a4b; --sienna: #a0311e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--parchment) 0%, var(--parchment-deep) 100%);
    color: var(--ink); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden;
  }
  #globe { position: absolute; inset: 0; }
  .panel {
    position: absolute; left: 16px; top: 16px; width: 232px; padding: 14px;
    background: rgba(250, 244, 230, 0.92); border: 1px solid rgba(107, 68, 35, 0.25); border-radius: 12px;
    box-shadow: 0 6px 24px rgba(31, 42, 58, 0.12);
  }
  .panel h1 { margin: 0 0 10px; font: 600 20px/1.1 Georgia, 'Times New Roman', serif; }
  .panel h2 { margin: 12px 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faded); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit; color: var(--ink); background: #fffaf0; border: 1px solid rgba(107, 68, 35, 0.3);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  #readout { margin: 10px 0 0; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-faded); white-space: pre-wrap; }
  #place { margin-top: 8px; min-height: 22px; font: 600 16px Georgia, serif; }
  #credit {
    position: absolute; right: 8px; bottom: 8px; padding: 2px 8px; border-radius: 6px;
    font-size: 10px; color: rgba(241, 231, 210, 0.85); background: rgba(31, 42, 58, 0.55);
  }
  @media (max-width: 600px) {
    .panel { left: 8px; right: 8px; top: 8px; width: auto; padding: 10px; }
    .panel h1, #readout { display: none; }
  }
</style>
</head>
<body>
<div id="globe"></div>
<div id="credit" hidden>Imagery &copy; Esri, Maxar, Earthstar Geographics</div>
<div class="panel">
  <h1>Globe engine</h1>
  <div id="place"></div>
  <h2>Data</h2>
  <div class="row" id="datasets">
    <button data-set="world">World 50m</button>
    <button data-set="world110">World 110m</button>
    <button data-set="us">US states</button>
    <button data-set="canada">Canada</button>
    <button data-set="china">China</button>
    <button data-set="india">India</button>
    <button data-set="russia">Russia</button>
  </div>
  <h2>View</h2>
  <div class="row">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">&minus;</button>
    <button id="reset">Reset</button>
    <button id="spin" aria-pressed="false">Spin</button>
  </div>
  <h2>Layers</h2>
  <div class="row">
    <button id="graticule" aria-pressed="true">Graticule</button>
    <button id="borders" aria-pressed="true">Borders</button>
    <button id="imagery" aria-pressed="false">Imagery</button>
  </div>
  <div id="readout"></div>
</div>

<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/earcut.min.js"></script>
<script src="globe.js"></script>
<script>
'use strict';
// Demo page for the globe engine. `?canvas2d=1` forces the Canvas 2D fallback.
// Exposes window.globe and window.demo for tests.
(function () {
  const params = new URLSearchParams(location.search);
  const globe = Globe.create(document.getElementById('globe'), { forceCanvas2D: params.has('canvas2d') });
  window.globe = globe;

  globe.defineStyles({
    land: '#f5ebd4',
    dim: 'rgba(237, 227, 204, 0.6)',
    hover: '#ecd9a8',
    good: '#5f8a4b',
    bad: '#a0311e',
    flash: '#e0a84a',
    hidden: 'transparent'
  });

  const BORDER = 'rgba(107, 68, 35, 0.55)';
  const SETS = {
    world: { url: 'data/countries-50m.json', object: 'countries' },
    world110: { url: 'data/countries-110m.json', object: 'countries' },
    us: { url: 'data/us-states-detail.json' },
    canada: { url: 'data/provinces-canada.json', object: 'provinces' },
    china: { url: 'data/provinces-china.json', object: 'provinces' },
    india: { url: 'data/provinces-india.json', object: 'provinces' },
    russia: { url: 'data/provinces-russia.json', object: 'provinces' }
  };
  const cache = {};
  const nameOf = f => f.properties.name;
  const state = { set: null, selected: null, previous: null, ringStart: 0, features: [], imagery: false };

  // Fetches a data set once: { features, borders } (borders only when it is TopoJSON).
  function fetchSet(name) {
    if (!cache[name]) {
      cache[name] = fetch(SETS[name].url).then(r => r.json()).then(json => {
        if (json.type !== 'Topology') return { features: json.features, borders: null };
        const object = json.objects[SETS[name].object];
        return { features: topojson.feature(json, object).features, borders: topojson.mesh(json, object) };
      });
    }
    return cache[name];
  }

  // Shows a data set. Everything but the two world sets sits on a dimmed world for context.
  async function load(name) {
    const data = await fetchSet(name);
    const layers = [];
    if (name !== 'world' && name !== 'world110') {
      const world = await fetchSet('world110');
      layers.push({ id: 'context', features: world.features, key: nameOf, borders: world.borders,
        borderColor: 'rgba(107, 68, 35, 0.22)', borderWidth: 0.6, style: 'dim' });
    }
    layers.push({ id: 'active', features: data.features, key: nameOf, interactive: true, borders: data.borders,
      borderColor: BORDER, borderWidth: 0.9, style: 'land' });
    state.set = name; state.selected = state.previous = null; state.features = data.features;
    document.querySelectorAll('#datasets button').forEach(b => b.setAttribute('aria-pressed', b.dataset.set === name));
    document.getElementById('place').textContent = '';
    await globe.setLayers(layers);
    applyImageryLook();
    globe.setHoverStyle('active', 'hover', key => !state.selected || key !== state.selected.key);
    globe.fitTo(data.features, { padding: 40, animate: name !== 'world' && name !== 'world110' });
  }

  globe.on('click', e => {
    if (!e.hit) return;
    state.previous = state.selected;
    if (state.previous) globe.setStyle('active', state.previous.key, null);
    state.selected = e.hit;
    state.ringStart = performance.now();
    globe.setStyle('active', e.hit.key, 'good');
    globe.flash('active', e.hit.key, 'flash', 700);
    globe.animate(1200);
    document.getElementById('place').textContent = e.hit.key;
  });
  globe.on('hover', hit => { if (!state.selected) document.getElementById('place').textContent = hit ? hit.key : ''; });

  // Overlay: outline and label for the selected place, rings when it is picked, and the
  // great-circle route from the place picked before it.
  globe.addOverlay((ctx, g) => {
    if (!state.selected) return;
    const here = globe.featureInfo('active', state.selected.key);
    if (!here) return;
    if (state.previous) {
      const there = globe.featureInfo('active', state.previous.key);
      if (there) globe.draw.geoLine(ctx, globe.anchor('active', state.previous.key), globe.anchor('active', state.selected.key), { color: 'rgba(160, 49, 30, 0.8)', width: 1.5, dash: [6, 5] });
    }
    globe.draw.outline(ctx, here.feature, { stroke: 'rgba(31, 42, 58, 0.9)', width: 1.5 });
    // The anchor, unlike the centroid, is always on the place's own land
    const anchor = globe.anchor('active', state.selected.key);
    globe.draw.rings(ctx, anchor, { t: (g.time - state.ringStart) / 1200, color: '#c8953c' });
    const p = g.project(anchor);
    if (!p.visible) return;
    ctx.font = '600 15px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(250, 244, 230, 0.9)'; ctx.lineJoin = 'round';
    ctx.strokeText(state.selected.key, p.x, p.y - 10);
    ctx.fillStyle = '#1f2a3a';
    ctx.fillText(state.selected.key, p.x, p.y - 10);
  });

  // Controls
  const toggle = (id, fn) => {
    const b = document.getElementById(id);
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on);
      fn(on, b);
    });
  };
  document.getElementById('datasets').addEventListener('click', e => { if (e.target.dataset.set) load(e.target.dataset.set); });
  document.getElementById('zoom-in').addEventListener('click', () => globe.zoomBy(1.6));
  document.getElementById('zoom-out').addEventListener('click', () => globe.zoomBy(1 / 1.6));
  document.getElementById('reset').addEventListener('click', () => globe.resetView());
  toggle('spin', on => globe.spin(on ? 8 : 0));
  toggle('graticule', on => globe.setGraticule(on));
  toggle('borders', on => globe.updateLayer('active', { bordersVisible: on }));
  // Imagery: Esri World Imagery tiles (note the z/y/x order). With it on, the land is left
  // clear so the picture shows, and borders turn light.
  const tileUrl = (z, x, y) => 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x;
  function applyImageryLook() {
    const on = state.imagery;
    globe.defineStyles({ land: on ? 'rgba(245, 235, 212, 0)' : '#f5ebd4', dim: on ? 'rgba(237, 227, 204, 0)' : 'rgba(237, 227, 204, 0.6)', hover: on ? 'rgba(236, 217, 168, 0.35)' : '#ecd9a8' });
    globe.updateLayer('active', { borderColor: on ? 'rgba(255, 250, 235, 0.85)' : BORDER });
    globe.updateLayer('context', { borderColor: on ? 'rgba(255, 250, 235, 0.3)' : 'rgba(107, 68, 35, 0.22)' });
    document.getElementById('credit').hidden = !on;
  }
  toggle('imagery', (on, b) => {
    if (!globe.supportsImagery()) { b.setAttribute('aria-pressed', false); b.textContent = 'Imagery (needs WebGL)'; b.disabled = true; return; }
    globe.setImagery({
      enabled: on,
      tileUrl,
      onStatus: status => {
        // 'failed' means no tile at all could be loaded: back to the drawn map
        state.imagery = status !== 'failed';
        b.setAttribute('aria-pressed', state.imagery);
        b.textContent = status === 'loading' ? 'Imagery (loading…)' : status === 'failed' ? 'Imagery (unavailable)' : 'Imagery';
        applyImageryLook();
      }
    });
    if (!on) { state.imagery = false; b.textContent = 'Imagery'; applyImageryLook(); }
  });

  // Readout, refreshed twice a second (reading stats does not draw a frame)
  const readout = document.getElementById('readout');
  setInterval(() => {
    const s = globe.stats(), v = globe.getView();
    readout.textContent = s.renderer + '  ' + s.frames + ' frames\n' +
      'frame ' + s.lastFrameMs.toFixed(2) + ' ms (avg ' + s.avgFrameMs.toFixed(2) + ')\n' +
      Math.round(s.triangles) + ' tris  ' + s.segments + ' segs\n' +
      'build ' + s.buildMs.toFixed(0) + ' ms\n' +
      (s.imagery ? 'imagery ' + s.imagery.status + '  tile zoom ' + s.imagery.zoom + '\n' : '') +
      'lon ' + v.lon.toFixed(1) + '  lat ' + v.lat.toFixed(1) + '  k ' + v.k.toFixed(2);
  }, 500);

  window.demo = { load, state, fetchSet };
  window.demoReady = load(params.get('data') || 'world');
})();
</script>
</body>
</html>
